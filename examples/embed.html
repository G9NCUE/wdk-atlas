<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atlas embedded in another page</title>
    <!-- Atlas dropped into a page that lives in a different directory. Both the stylesheet and
         the script are loaded from one folder up; the script then finds atlas.yaml and the
         metrics beside itself rather than beside this page, which is the whole point. -->
    <link rel="stylesheet" href="../styles.css?v=113" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #101010; color: #eee; }
      .host { padding: 24px; border-bottom: 1px solid #333; }
      .host h1 { margin: 0 0 4px; font-size: 20px; }
      .host p { margin: 0; color: #999; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="host">
      <h1>Some other site</h1>
      <p>Everything below this line is Atlas, served from the folder above.</p>
    </div>
    <script type="module" src="../app.js?v=113"></script>
  </body>
</html>
