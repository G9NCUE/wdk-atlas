  # only: bin/collect-metrics.mjs ignores it and tracks every public wdk-* repo, wdk-docs included.
  ignoreRepos:
    # Empty scaffolds and superseded prototypes agreed for deletion or archive on 2026-09-06; remove
    # each line when its repo goes.
    - wdk-protocol-bridge
    - wdk-protocol-swap
    - wdk-protocol-swap-dedust-ton
    - wdk-protocol-swap-moonpay
    - wdk-protocol-lending-morpho-evm
    - wdk-signer-evm
    - wdk-signer-tron
    - wdk-local-signer-cpp
    - wdk-wallet-rgb
    - wdk-wallet-solana-jupiterz
    - wdk-safe-protocol-kit
    - wdk-safe-relay-kit
    - wdk-protocol-lending-aave
    - wdk-protocol-bridge-usdt0
    - wdk-protocol-bridge-stargate
    - wdk-protocol-bridge-allbridge
    - wdk-demo-wallet
    - wdk-backup-remote
    # Test bench, private: one test suite per module, not a module.
    - wdk-playground
    # Private port of ethers for Bare, never published. Revisit if it is.
    - wdk-bare-ethers
    - wdk-docs
    - wdk-docs-migration
    - wdk-site
    - wdk-dev-website
    - wdk-dev-website-app-node
    - wdk-devops
    - wdk-devops-open
    - wdk-ansible-playbooks
    - wdk-module-templates
    - wdk-lib-lookup-storage
  # Org repos that hold a partner's module: the org hosts the repo and publishes the package, so the map
  # keeps them as the org's, but the Dashboard measures them with the third-party packages, under the
  # partner's name, and leaves them out of every first-party number. Repo name: who built it.
  thirdPartyRepos:
    wdk-protocol-fiat-moonpay: MoonPay
    wdk-protocol-lending-aave-evm: Aave
    wdk-protocol-swap-velora-evm: Velora
  # Dependencies never drawn as `requires`. Foundation modules are implicit already.
  implicitRequires: []
  # Sections whose modules consume many packages (apps, developer tools): only their stale `requires` are reported.
  consumerSections: [app, dev]
  # Backend workers, apps and infrastructure: never modules, never reported.
  ignorePattern: "(^wdk-.*-wrk(-|$)|-app-node$|-e2e-tests$|^wdk-faucet-|^wdk-indexer-docs$|^wdk-indexer-webhook)"

# North stars: the three objectives every roadmap initiative serves (roadmap items carry `northStar: <id>`).
# `keyResults` are the measurable results behind each star, shown on the roadmap rows and on the Key results page.
#   id, label, note, and a `metric` that reads public data. Nothing is typed by hand: a result that cannot
#   be recomputed from npm, GitHub or this file is not a key result here.
#   kinds: share (field over a scope: published packages or first-party wallets; fields stable, audits, ci, signer),
#   average (field health over a scope, target %), count (source thirdPartyModules | privateRepos | examples, target),
#   seriesTotal (series, days, target: a count over a rolling window), issueResponse (withinHours, target %),
#   currency (target: share of chosen installs on the latest release).
# Rewritten 2026-09-13 from the Q3 2026 OKR sheet so every result is public and checkable; pending review.
northStars:
  # A published audit, green CI and the shared signer interface were key results here until
  # 2026-09-20. They are gates on a checklist: binary, and each one is already on the release
  # readiness table per package, where the 1.0.0 initiative carries the work. Leaving beta
  # stayed, because it is the definition of production grade rather than a step towards it,
  # and because the share moves the day any single package ships stable.
  - id: kit
    title: WDK is a production-grade kit for every platform
    summary: Secure, audited, out of beta, with the same SDK on iOS, Android, desktop and Node.
    keyResults:
      - id: stable
        label: "Every published package at a stable release, out of beta"
        metric: { kind: share, field: stable, scope: published }
        note: The npm latest tag carries no beta, alpha or rc suffix.
      - id: currency
        label: "Half of chosen installs on the current release"
        metric: { kind: currency, target: 50 }
        note: >-
          A kit people cannot upgrade is not production grade. Share of installs landing on the
          latest release, counting only installs somebody chose, since one our own packages
          pinned is on an old version by construction. 11% on 2026-09-20. The 50% target is a
          first bar and wants confirming.
      - id: public
        label: "No private repo in the WDK namespace"
        metric: { kind: count, source: privateRepos, target: 0 }
        note: Every WDK repo is meant to be public. A private one is either a mistake or waiting on a release.
  - id: dx
    title: Best in class Developer Experience
    summary: From zero to a first transaction in minutes, for humans and for agents.
    keyResults:
      - id: examples
        label: "Fifteen examples published, six more than in September 2026"
        metric: { kind: count, source: examples, target: 15 }
        note: Top-level example folders in the examples repo; nine on 2026-09-13.
      - id: issue-response
        label: "Open issues answered within a week"
        metric: { kind: issueResponse, withinHours: 168, target: 100 }
  - id: ecosystem
    title: A thriving ecosystem
    summary: Modules, chains and integrations built by others on top of WDK.
    keyResults:
      - id: modules
        label: "Twelve or more WDK-compatible modules or integrations published"
        metric: { kind: count, source: thirdPartyModules, target: 12 }
        note: Counted as third-party modules on the map, live status. First-party packages are on the dashboard.
      # Was "up by 50% in the quarter" until 2026-09-20. Between zero and three land in most
      # weeks, so a percentage against that base said more about the base than about anyone's
      # work, and the comparison needed a full previous quarter that does not exist before
      # 2026Q4. A rolling count is measurable today and still falls when contribution dries up.
      - id: external-prs
        label: "Twenty external pull requests merged in a month"
        metric: { kind: seriesTotal, series: externalPrsMerged, days: 30, target: 20 }
        note: >-
          Merged in the last 30 days, by authors who are not members or collaborators of the
          org, whatever account they use. Seventeen on 2026-09-20, though one week of the four
          carried ten of them. The target of twenty is a first bar and wants confirming.
      - id: health
        label: "Community health above 80% on every repo"
        metric: { kind: average, field: health, scope: published, target: 80 }
        note: GitHub's community profile score. README, licence, contributing guide, code of conduct, issue and pull request templates.

# Columns of the chain × capability grid inside the engine, in display order.
# A module lands in every column named in its `chains`; `also` folds extra labels into a column
# (Spark is a Bitcoin layer, so SPARK counts as BTC). Labels not listed here get a column of their own.
chains:
  - { id: BTC, label: Bitcoin, also: [SPARK] }
  - { id: EVM, label: Ethereum & EVM }
  - { id: SOL, label: Solana }
  - { id: TON, label: TON }
  - { id: TRON, label: TRON }
  - { id: APTOS, label: Aptos }
  - { id: COSMOS, label: Cosmos }

sections:
  - id: app
    label: Your app
    blurb: What people install. Start from a starter or from scratch
    path:
      label: You tap Send
      text: in a starter or your own screens
    lanes:
      - id: apps
        label: Starters
        blurb: One reference app per phone technology

  - id: platform
    label: Phone plumbing
    blurb: Carries the app's taps to the engine and the answers back
    path:
      label: The phone carries it
      text: the host binding hands the request across; services never see the keys
    lanes:
      - id: native
        label: Host binding
        blurb: The phone side. Each one talks to the engine through the sealed room below
      - id: services
        label: Services
        blurb: Run in the app beside the host binding. Look things up or keep things safe. Never touch the keys

  - id: core
    label: The engine
    blurb: Plain JavaScript, with two supported ways to run it. In plain Node, lightweight and familiar, like any other library. Or on a phone, inside a Bare worklet, where everything in this box lives and the keys stay out of the app
    module: pear-wrk-wdk
    seal: Keys never leave this box
    path:
      label: Inside the sealed room
      text: the assembler picks the wallet; a protocol may ask it to sign
    # Lanes listed here are drawn as one chain × capability grid instead of card rows.
    matrix: [wallets, protocols]
    why:
      label: "Plain Node or a Bare worklet: when to use which"
      points:
        - Plain Node is the lightweight path. No bundle to build, no extra runtime, the same feel as ethers or bitcoinjs and as the hosted SDKs. Easiest to debug.
        - The worklet is the phone path. One bundle runs on iOS, Android and desktop with no per-platform port.
        - Its own thread. Signing and network calls never block the app's screen.
        - A sealed room. Keys and seeds stay in the worklet; the app only ever sees the encrypted form.
        - Both are official. Pick Node for servers, agents and quick trials; pick the worklet for anything that ships to a phone.
    lanes:
      - id: kernel
        label: The assembler
        blurb: Creates each wallet and hands every protocol its account
      - id: protocols
        label: Protocols
        blurb: Things you do with money beyond sending. Each one holds a wallet and asks it to sign
        groups:
          - { id: swap, label: Swap, hint: same chain }
          - { id: swidge, label: Swap & bridge, hint: across chains }
          - { id: bridge, label: Bridge, hint: USD₮0 }
          - { id: lending, label: Earn & borrow }
          - { id: multisig, label: Shared approval, hint: multisig }
          - { id: fiat, label: Buy & sell for cash, hint: any chain }
          - { id: sda, label: Smart deposit address }
      - id: wallets
        label: Wallets
        blurb: One per chain. Hold the keys and sign. Variants hang under their base
        groups:
          - { id: base, label: Wallet, hint: holds the keys, signs }
          - { id: gasless, label: Fees paid in USD₮, hint: gasless variant }
          - { id: smart-account, label: Smart account, hint: account abstraction }
          - { id: layer, label: Layers & assets, hint: on top of the base wallet }
      - id: modules
        label: Other modules
        blurb: Loaded by the assembler like a protocol, but not about money
      - id: internals
        label: Under the hood
        blurb: Engine-side pieces the app never calls directly

  - id: foundation
    label: Foundation
    path:
      label: Everything stands on
      text: the shared rulebook
    blurb: What everything else imports. Runs wherever the modules run, in the worklet on a phone, in Node elsewhere. The blank forms every wallet and protocol fills in, and the reference data they all read

  - id: dev
    page: dev
    label: Developer resources
    blurb: For building with WDK. Not part of a shipped wallet
    lanes:
      - id: reference
        label: Learn
      - id: tools
        label: Build

modules:
  # --- Core ---
  - id: wdk
    name: wdk
    title: The assembler
    section: core
    band: kernel
    status: shipped
    publisher: tetherto
    summary: 'The conductor. One object your app talks to: it creates each wallet, hands every protocol the account it works on, and applies transaction rules. Everything else in the kit plugs into it.'
    notes:
      - Phase 1 of the policy engine already ships inside this package (src/policy, since 1.0.0-beta.16). The wdk-policies repo is an empty README
    repo: https://github.com/tetherto/wdk

  - id: wdk-wallet
    name: wdk-wallet
    title: The shared rulebook
    section: foundation
    status: shipped
    publisher: tetherto
    summary: 'The rulebook every wallet and protocol package follows. It fixes the shape of a wallet, an account and each kind of protocol, so all modules plug in the same way. Apps never use it directly.'
    notes:
      - Protocol forms in src/protocols (checked 2026-09-02): bridge, fiat, lending, sda, swap, swidge
      - ISigner, the signer form. wdk-wallet-evm ships seed and private-key signers; btc has none yet
    repo: https://github.com/tetherto/wdk-wallet

  - id: wdk-policies
    name: wdk-policies
    title: Transaction rules
    section: core
    band: kernel
    status: planned
    publisher: tetherto
    summary: 'A library of ready-made transaction rules: limits, allow-lists, checks before a transfer leaves. The rules engine itself lives in the conductor and stays there; this package will hold the common policies (Jonathan, 2026-09-06).'
    repo: https://github.com/tetherto/wdk-policies

  - id: wdk-wallet-btc
    name: wdk-wallet-btc
    title: Bitcoin
    section: core
    band: wallets
    kind: base
    status: shipped
    publisher: tetherto
    chains: [BTC]
    summary: 'Creates and manages Bitcoin wallets from a seed phrase: addresses, balances, sending and signing. The base that every other Bitcoin-related module builds on.'
    repo: https://github.com/tetherto/wdk-wallet-btc
    relations:
      - { type: requires, target: wdk-failover-provider }

