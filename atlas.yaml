  repoPattern: "^(wdk$|wdk-|pear-wrk-wdk$|create-wdk-module$)"
  # GitHub logins counted as the Tether team on the Dashboard, so their pull requests and issues do
  # not read as external. Maintained by hand: GitHub reveals private org membership only to a member's
  # token, and the workflows run without any stored secret. Seed (2026-09-18): every tetherto member
  # with a commit in a WDK repo. Add people when they join, remove them when they leave.
  team:
