roadmap:
  - id: signers
    northStar: kit
    label: Abstract signers
    summary: One signer interface on every wallet package, so seed, private key, hardware and remote signers plug into the same account. Merged on EVM, in review on Bitcoin. Solana has a proof of concept from the first design round (wdk-wallet-solana#31), never merged, to be redone against the final contract.
    quarter: 2026Q4
    status: wip
    priority: P0
    modules:
      - { id: wdk-wallet-btc, status: wip, progress: 80 }
      - { id: wdk-wallet-evm, status: wip, progress: 80 }
      - { id: wdk-wallet-solana, status: planned }
      - wdk-wallet-evm-erc-4337
      - wdk-wallet-evm-7702-gasless
      - wdk-wallet-solana-gasless
      - wdk-wallet-ton
      - wdk-wallet-ton-gasless
      - wdk-wallet-tron
      - wdk-wallet-tron-gasfree
      - wdk-wallet-spark
      - wdk-wallet-aptos
  - id: ledger
    northStar: kit
    label: Ledger
    parent: signers
    summary: Hardware signing through a standalone Ledger package, first on Bitcoin, EVM and Solana; other hardware wallets can follow. Draft signers exist for all three from the first design round, none merged. The package is not created yet, and Bitcoin and Solana wait on the abstract signer.
    quarter: 2026Q4
    status: planned
    priority: P2
    modules:
      - { id: wdk-wallet-btc, status: planned }
      - { id: wdk-wallet-evm, status: planned }
      - { id: wdk-wallet-solana, status: planned }
  - id: passkey-signer
    northStar: kit
    label: Passkey signer
    summary: A pluggable passkey signer for EVM chains that expose the 256r1 precompile.
    quarter: 2027Q1
    status: planned
    priority: P2
    modules: [wdk-wallet-evm]
  - id: remote-signers
    northStar: kit
    label: Remote signers
    summary: MPC and custody providers signing through the abstract signer on EVM, proven with prototypes for Dfns, Fireblocks, Turnkey and Openfort. Whether Tether publishes vendor packages or leaves them to the ecosystem is still open.
    quarter: 2026Q3
    status: done
    priority: P2
    modules: [wdk-wallet-evm]
  # ---- Agent wallets. From the team's staged discussion of September 2026: a proposal, drawn here so it can
  # be checked, not a decision. The umbrella carries the plan and this quarter's steps; the tiers stand on
  # their own in 2027, since a child is always drawn under its parent's quarter.
  - id: agent-wallet-plan
    northStar: kit
    label: Agent wallets, the proposed plan
    summary: 'Let an agent spend a small, fixed part of a wallet, and take it back whenever you like. What makes it safe: the check happens where the agent cannot touch it. Tier 0 is what we currently have, improvements to come in 2027.'
    quarter: 2026Q4
    status: planned
    priority: P0
    modules: [wdk, wdk-cli, wdk-mcp-toolkit]
  - id: policy-engine-promise
    northStar: kit
    label: Say what the policy engine promises today
    parent: agent-wallet-plan
    summary: Write down in the docs what the policy engine does and does not protect against. Today it runs in the same process as the agent, so a compromised agent can get around it. Say so, and say it is not ready for agents running on their own.
    quarter: 2026Q4
    status: planned
    priority: P0
    modules: [wdk, wdk-mcp-toolkit]
  - id: agent-default-deny
    northStar: kit
    label: Default deny on the agent path
    parent: agent-wallet-plan
    summary: An agent that reaches an account with no policy should be allowed nothing, not everything. And the seed, and the switch that says yes to every confirmation, should not sit where the agent can read them.
    quarter: 2026Q4
    status: planned
    priority: P1
    modules: [wdk-mcp-toolkit, wdk-cli]
  - id: policy-tier-1
    northStar: kit
    label: Policy engine tier 1, the Vault
    summary: 'Step two. The keys and the policy engine move into their own process, the daemon behind the command line, out of the agent''s reach. The agent gets a token and four calls: limits, address, balance, send. It asks for a transfer; WDK builds it. One account per agent, revocable alone.'
    quarter: 2027Q1
    status: planned
    priority: P0
    modules: [wdk-cli, wdk]
  - id: policy-tier-2
    northStar: kit
    label: Policy engine tier 2, the boundary hardened
    summary: Step three. Same token, but the Vault runs under its own user, or the agent runs in a container, so even an agent that can run code cannot read the keys. How far to go, a separate user or a secure enclave, is the question to settle here.
