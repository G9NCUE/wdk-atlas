# WDK Atlas — source of truth for the map.
# Official modules: the tetherto repos. bin/check-atlas.mjs (weekly GitHub Action, see .github/workflows)
# compares this file with GitHub and npm and keeps the "Atlas drift" issue up to date; `audit:` below tunes it.
# Ecosystem modules: documented outside-org packages from docs.wallet.tether.io.
#
# The main page draws the sections as a cross-section, one band per section, with the rail step
# from `path`. A section with `matrix: [lane ids]` draws those lanes as a chain × capability grid
# (columns from `chains` below, rows from the lanes' `groups`, a module's row from its `kind`).
# relations: `requires` = a package.json dependency (checked by bin/check-atlas.mjs); `under` = drawn as a
#   column under that box; `on` = a protocol runs on that wallet's account; `implements` = fills that form.
# private: true when the repo is not public; draws a lock on the card. bin/check-atlas.mjs reports the
#   flag when it stops matching GitHub, so it cannot drift silently.
# chains: chain labels (EVM, BTC, TON, …); they place a module in the columns of the engine grid.
# short: optional shorter title for the grid, where the row and column already say the rest.
# package: the npm package, only when the repo root is not it (a monorepo). Otherwise bin/collect-metrics.mjs
#   reads the name from the root package.json. Third-party packages are measured from npm alone.
# roadmap: one list at the root (below). Each item names the modules it touches; the chips
# under a module box and the "Pending work" list in its drawer are derived from it.
#   id, label, summary, quarter (2026Q1 … 2027Q2 | backlog), status (planned | wip | done),
#   priority (P0..P2), parent (id of the umbrella item, optional),
#   modules: list of module ids, or { id, status, progress } to override the state for that module.
#   partners (optional): the outside parties an item cannot be finished without. Drawn on the card, so a
#     P0 the team cannot close alone does not read like one it can.
# progress: 0–100 fill-wash on WIP packages and WIP roadmap chips.

mission: Open-source, modular wallet infrastructure for anyone.
# One line for people who have never heard of WDK; the Overview page opens with it.
about: >-
  The Wallet Development Kit (WDK) is Tether's open-source toolkit for building wallets.
  Published on npm under Apache-2.0, built in public on GitHub.

# Settings for bin/check-atlas.mjs.
