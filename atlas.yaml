  - id: wdk-asset-registry
    name: wdk-asset-registry
    title: Known tokens list
    section: foundation
    status: shipped
    publisher: tetherto
    summary: Shared asset schema plus a bundled list of common tokens. Pure in-memory, no RPC. Meant as the one asset identity model for every module; today only the CLI uses it.
    notes:
      - Runtime-agnostic. Plain ESM with zod and fast-equals; runs in Node, the worklet or the app equally
      - Only consumer in the org is wdk-cli (checked 2026-09-02). No wallet, protocol, starter or worklet imports it
    repo: https://github.com/tetherto/wdk-asset-registry

  - id: wdk-failover-provider
    name: wdk-failover-provider
    title: Fallback network connection
    section: core
    band: internals
    status: shipped
    publisher: tetherto
    summary: Tries the next network connection when one fails. Used by the EVM wallets inside the worklet, and by the price feed in the app.
    repo: https://github.com/tetherto/wdk-failover-provider

  - id: wdk-secret-manager
    name: wdk-secret-manager
    title: Seed generation & encryption
    section: core
    band: internals
    status: shipped
    publisher: tetherto
    summary: Generates the seed and encrypts it so only the encrypted form ever leaves the room. Built to run inside the worklet as well as in ordinary JavaScript.
    notes:
      - In the shipped flow the worklet does this job with its own code (pear-wrk-wdk, handlers/secrets.js); this package is the standalone version of it
    repo: https://github.com/tetherto/wdk-secret-manager

  - id: wdk-signer-local
    name: wdk-signer-local
    title: Signs on this device
    section: core
    band: internals
    status: shipped
    publisher: tetherto
    summary: A native add-on inside the worklet that keeps keys in the phone's keychain or KeyStore behind biometrics and signs there.
    notes:
      - One filling of the signer form (ISigner in wdk-wallet — derive, getAddress, sign). Ledger, on the wallet roadmaps, would be the second
      - No wallet uses it yet; "Abstract signers" on each wallet is the work that lets them
    repo: https://github.com/tetherto/wdk-signer-local

