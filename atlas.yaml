roadmap:
  - id: signers
    northStar: kit
    label: Abstract signers
    summary: One signer interface on every wallet package, so seed, private key, hardware and remote signers plug into the same account.
    quarter: 2026Q3
    status: wip
    priority: P0
    modules:
      - { id: wdk-wallet-btc, status: wip, progress: 80 }
      - { id: wdk-wallet-evm, status: wip, progress: 80 }
      - { id: wdk-wallet-solana, status: wip, progress: 50 }
      - wdk-wallet-evm-erc-4337
      - wdk-wallet-evm-7702-gasless
      - wdk-wallet-solana-gasless
      - wdk-wallet-ton
      - wdk-wallet-ton-gasless
      - wdk-wallet-tron
      - wdk-wallet-tron-gasfree
      - wdk-wallet-spark
      - wdk-wallet-aptos
  - id: ledger
    northStar: kit
    label: Ledger
    parent: signers
    summary: Hardware signing through a standalone Ledger package, first on Bitcoin, EVM and Solana; other hardware wallets can follow the same path.
    quarter: 2026Q3
    status: wip
    priority: P2
    modules:
      - { id: wdk-wallet-btc, status: wip, progress: 60 }
      - { id: wdk-wallet-evm, status: wip, progress: 60 }
      - { id: wdk-wallet-solana, status: wip, progress: 40 }
  - id: passkey-signer
    northStar: kit
    label: Passkey signer
    parent: signers
    summary: A pluggable passkey signer for EVM chains that expose the 256r1 precompile.
    quarter: 2026Q3
    status: planned
    priority: P2
    modules: [wdk-wallet-evm]
  - id: mpc-signer
    northStar: kit
    label: MPC signer
    parent: signers
    summary: Spike on pluggable MPC signers, or recipes for using existing MPC services with WDK.
    quarter: 2026Q3
    status: planned
    priority: P2
    modules: []
  - id: policy-engine
    northStar: kit
    label: Policy engine
    summary: Phase 2 libraries for common rules, phase 3 a policy DSL, phase 4 policies in the developer portal.
    quarter: 2026Q3
    status: wip
    priority: P0
    modules: [wdk, wdk-policies]
  - id: error-handling
    northStar: kit
    label: Standardised error handling
    summary: The same error classes and messages across every wallet module.
    quarter: 2026Q3
    status: wip
    priority: P1
    progress: 70
    modules: [wdk, wdk-wallet]
  - id: native-cores-v2
    northStar: kit
    label: Swift and Kotlin cores on par with React Native
    summary: Strong typing, sensitive storage and a plug-in interface for native packages, matching the React Native host.
    quarter: 2026Q3
    status: wip
    priority: P0
    modules: [wdk-core-kotlin, wdk-core-swift]
  - id: sda
    northStar: kit
    label: Smart deposit address interface
    summary: Deposit on chain X, receive on chain Y. The interface is in wdk-wallet; the first module is next.
    quarter: 2026Q3
    status: done
    priority: P0
    modules: [wdk-wallet, wdk-protocol-sda-coming-soon]
  - id: multisig-safe
    northStar: kit
    label: Safe multisig on EVM
    quarter: 2026Q3
    status: wip
    priority: P1
    modules: [wdk-protocol-multisig-safe]
  - id: multisig-squads
    northStar: kit
    label: Squads multisig on Solana
    quarter: 2026Q3
    status: wip
    priority: P1
    modules: [wdk-protocol-multisig-squads]
