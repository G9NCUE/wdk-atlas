# WDK Atlas — source of truth for the map.
# Official modules: the tetherto repos. bin/check-atlas.mjs (weekly GitHub Action, see .github/workflows)
# compares this file with GitHub and npm and keeps the "Atlas drift" issue up to date; `audit:` below tunes it.
# Ecosystem modules: documented outside-org packages from docs.wallet.tether.io.
#
# The main page draws the sections as a cross-section, one band per section, with the rail step
# from `path`. A section with `matrix: [lane ids]` draws those lanes as a chain × capability grid
# (columns from `chains` below, rows from the lanes' `groups`, a module's row from its `kind`).
# relations: `requires` = a package.json dependency (checked by bin/check-atlas.mjs); `under` = drawn as a
#   column under that box; `on` = a protocol runs on that wallet's account; `implements` = fills that form.
# chains: chain labels (EVM, BTC, TON, …); they place a module in the columns of the engine grid.
# short: optional shorter title for the grid, where the row and column already say the rest.
# roadmap: one list at the root (below). Each item names the modules it touches; the chips
# under a module box and the "Pending work" list in its drawer are derived from it.
#   id, label, summary, quarter (2026Q1 … 2027Q2 | backlog), status (planned | wip | done),
#   priority (P0..P2), progress (0-100, optional), parent (id of the umbrella item, optional),
#   modules: list of module ids, or { id, status, progress } to override the state for that module.
# progress: 0–100 fill-wash on WIP packages and WIP roadmap chips.

mission: Open-source, self-custodial wallet infrastructure for anyone.

# Settings for bin/check-atlas.mjs.
audit:
  org: tetherto
  repoPattern: "^(wdk-|pear-wrk-wdk$|create-wdk-module$)"
  # Org repos that are not modules; not reported as missing from the atlas.
  ignoreRepos:
    - wdk-docs
    - wdk-docs-migration
    - wdk-site
    - wdk-dev-website
    - wdk-dev-website-app-node
    - wdk-devops
    - wdk-devops-open
    - wdk-ansible-playbooks
    - wdk-module-templates
  # Dependencies never drawn as `requires`. Foundation modules are implicit already.
  implicitRequires: []
  # Backend workers, apps and infrastructure: never modules, never reported.
  ignorePattern: "(-wrk$|-wrk-|-app-node$|-e2e-tests$|^wdk-faucet-|^wdk-indexer-docs$|^wdk-indexer-webhook)"

# North stars: the three objectives every roadmap initiative serves (roadmap items carry `northStar: <id>`).
# `keyResults` are the measurable results behind each star, shown on the roadmap rows and on the Key results page.
#   id, label; optional: target, current, unit, progress (0-100), source (how it is measured), note.
#   Without `progress` (or `target` and `current`) a key result shows as "not measured".
# Inherited from the Q3 2026 OKR sheet with light editing; a starting point pending review, not a commitment.
northStars:
  - id: kit
    title: WDK is a production-grade kit for every platform
    summary: Secure, audited, out of beta, with the same SDK on iOS, Android, desktop and Node.
    keyResults:
      - { id: audit, label: "Complete the first quarterly security audit and take the packages out of beta" }
      - { id: signer-interface, label: "One signer interface on every wallet package" }
      - { id: native-parity, label: "Swift and Kotlin cores on par with React Native" }
      - { id: coverage-ci, label: "Function coverage above 95% and testnet transactions in CI" }
  - id: dx
    title: Best in class Developer Experience
    summary: From zero to a first transaction in minutes, for humans and for agents.
    keyResults:
      - { id: recipes, label: "Six new recipes and examples across the docs, the CLI and the agent toolkits" }
      - { id: des, label: "Developer experience score above 70" }
      - { id: issue-response, label: "Open issues answered within a week" }
  - id: ecosystem
    title: A thriving ecosystem
    summary: Modules, chains and integrations built by others on top of WDK.
    keyResults:
      - { id: modules, label: "Twelve or more WDK-compatible modules or integrations published" }
      - { id: external-prs, label: "External pull requests merged up by 50% in the quarter" }
      - { id: community-projects, label: "Five live community projects on WDK; five funded through bounties" }
      - { id: ecosystem-call, label: "Monthly update call with the ecosystem teams" }
      - { id: transparency, label: "Roadmap, contribution guidelines and module review process public and current" }

# Columns of the chain × capability grid inside the engine, in display order.
# A module lands in every column named in its `chains`; `also` folds extra labels into a column
# (Spark is a Bitcoin layer, so SPARK counts as BTC). Labels not listed here get a column of their own.
chains:
  - { id: BTC, label: Bitcoin, also: [SPARK] }
  - { id: EVM, label: Ethereum & EVM }
  - { id: SOL, label: Solana }
  - { id: TON, label: TON }
  - { id: TRON, label: TRON }
  - { id: APTOS, label: Aptos }
  - { id: COSMOS, label: Cosmos }

sections:
  - id: app
    label: Your app
    blurb: What people install. Start from a starter or from scratch
    path:
      label: You tap Send
      text: in a starter or your own screens
    lanes:
      - id: apps
        label: Starters
        blurb: One reference app per phone technology

  - id: platform
    label: Phone plumbing
    blurb: Carries the app's taps to the engine and the answers back
    path:
      label: The phone carries it
      text: the host binding hands the request across; services never see the keys
    lanes:
      - id: native
        label: Host binding
        blurb: The phone side. Each one talks to the engine through the sealed room below
      - id: services
        label: Services
        blurb: Run in the app beside the host binding. Look things up or keep things safe. Never touch the keys

  - id: core
    label: The engine
    blurb: Plain JavaScript. It runs in Node as-is, and that is the quickest way to try it. On a phone the kit runs it inside a Bare worklet instead, and everything in this box lives there
    module: pear-wrk-wdk
    seal: Keys never leave this box
    path:
      label: Inside the sealed room
      text: the assembler picks the wallet; a protocol may ask it to sign
    # Lanes listed here are drawn as one chain × capability grid instead of card rows.
    matrix: [wallets, protocols]
    why:
      label: Why a Bare worklet, not plain Node?
      points:
        - Plain Node works and developers know it. Nothing in this box needs the worklet to function.
        - One runtime, one SDK. The same bundle runs on iOS, Android and desktop, with no per-platform port.
        - Its own thread. Signing and network calls never block the app's screen.
        - A sealed room. Keys and seeds stay in the worklet; the app only ever sees the encrypted form.
    lanes:
      - id: kernel
        label: The assembler
        blurb: Creates each wallet and hands every protocol its account
      - id: protocols
        label: Protocols
        blurb: Things you do with money beyond sending. Each one holds a wallet and asks it to sign
        groups:
          - { id: swap, label: Swap, hint: same chain }
          - { id: swidge, label: Swap & bridge, hint: across chains }
          - { id: bridge, label: Bridge, hint: USD₮0 }
          - { id: lending, label: Earn & borrow }
          - { id: multisig, label: Shared approval, hint: multisig }
          - { id: fiat, label: Buy & sell for cash, hint: any chain }
          - { id: sda, label: Smart deposit address }
      - id: wallets
        label: Wallets
        blurb: One per chain. Hold the keys and sign. Variants hang under their base
        groups:
          - { id: base, label: Wallet, hint: holds the keys, signs }
          - { id: gasless, label: Fees paid in USD₮, hint: gasless variant }
          - { id: smart-account, label: Smart account, hint: account abstraction }
          - { id: layer, label: Layers & assets, hint: on top of the base wallet }
      - id: modules
        label: Other modules
        blurb: Loaded by the assembler like a protocol, but not about money
      - id: internals
        label: Under the hood
        blurb: Engine-side pieces the app never calls directly

  - id: foundation
    label: Foundation
    path:
      label: Everything stands on
      text: the shared rulebook
    blurb: What everything else imports. Runs wherever the modules run, in the worklet on a phone, in Node elsewhere. The blank forms every wallet and protocol fills in, and the reference data they all read

  - id: dev
    page: dev
    label: Developer resources
    blurb: For building with WDK. Not part of a shipped wallet
    lanes:
      - id: reference
        label: Learn
      - id: tools
        label: Build

modules:
  # --- Core ---
  - id: wdk
    name: wdk
    title: The assembler
    section: core
    band: kernel
    status: shipped
    publisher: tetherto
    summary: 'The conductor. One object your app talks to: it creates each wallet, hands every protocol the account it works on, and applies transaction rules. Everything else in the kit plugs into it.'
    notes:
      - Phase 1 of the policy engine already ships inside this package (src/policy, since 1.0.0-beta.16). The wdk-policies repo is an empty README
    repo: https://github.com/tetherto/wdk

  - id: wdk-wallet
    name: wdk-wallet
    title: The shared rulebook
    section: foundation
    status: shipped
    publisher: tetherto
    summary: 'The rulebook every wallet and protocol package follows. It fixes the shape of a wallet, an account and each kind of protocol, so all modules plug in the same way. Apps never use it directly.'
    notes:
      - Protocol forms in src/protocols (checked 2026-09-02): bridge, fiat, lending, sda, swap, swidge
      - ISigner, the signer form. wdk-wallet-evm ships seed and private-key signers; btc has none yet
    repo: https://github.com/tetherto/wdk-wallet

  - id: wdk-policies
    name: wdk-policies
    title: Transaction rules
    section: core
    band: kernel
    status: planned
    publisher: tetherto
    summary: 'A home for rules about transactions: limits, allow-lists, checks before a transfer leaves. The first version of the rules engine lives inside the conductor today; shared rule libraries would go here.'
    repo: https://github.com/tetherto/wdk-policies

