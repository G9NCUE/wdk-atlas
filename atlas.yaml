# WDK Atlas — source of truth.
# Official modules: every repo in wdk-repos.txt.
# Ecosystem modules: documented outside-org packages from docs.wallet.tether.io.
#
# The main page draws the sections as a cross-section, one band per section, with the rail step
# from `path`. A section with `matrix: [lane ids]` draws those lanes as a chain × capability grid
# (columns from `chains` below, rows from the lanes' `groups`, a module's row from its `kind`).
# relations: requires / implements between modules; selecting a module fades everything unrelated.
# chains: chain labels (EVM, BTC, TON, …); they place a module in the columns of the engine grid.
# short: optional shorter title for the grid, where the row and column already say the rest.
# roadmap: one list at the root (below). Each item names the modules it touches; the chips
# under a module box and the "Pending work" list in its drawer are derived from it.
#   id, label, summary, quarter (2026Q1 … 2027Q2 | backlog), status (planned | wip | done),
#   priority (P0..P2), progress (0-100, optional), parent (id of the umbrella item, optional),
#   modules: list of module ids, or { id, status, progress } to override the state for that module.
# progress: 0–100 fill-wash on WIP packages and WIP roadmap chips.

mission: Open-source, self-custodial wallet infrastructure for anyone.

# North stars: the three destinations every roadmap initiative serves (roadmap items carry `northStar: <id>`).
# `objectives` are the measurable key results behind each star; kept here, not rendered on the page.
northStars:
  - id: kit
    title: A production-grade kit on every platform
    summary: Secure, audited, out of beta, with the same SDK on iOS, Android, desktop and Node.
    objectives:
      - Complete the first quarterly security audit and take the packages out of beta
      - One signer interface on every wallet package
      - Swift and Kotlin cores on par with React Native
      - Function coverage above 95% and testnet transactions in CI
  - id: dx
    title: The best developer experience
    summary: From zero to a first transaction in minutes, for humans and for agents.
    objectives:
      - Six new recipes and examples across the docs, the CLI and the agent toolkits
      - Developer experience score above 70
      - Open issues answered within a week
  - id: ecosystem
    title: A thriving ecosystem
    summary: Modules, chains and integrations built by others on top of WDK.
    objectives:
      - Twelve or more WDK-compatible modules or integrations published
      - External pull requests merged up by 50% in the quarter
      - Five live community projects on WDK; five funded through bounties
      - Monthly update call with the ecosystem teams

# Columns of the chain × capability grid inside the engine, in display order.
# A module lands in every column named in its `chains`; `also` folds extra labels into a column
# (Spark is a Bitcoin layer, so SPARK counts as BTC). Labels not listed here get a column of their own.
chains:
  - { id: BTC, label: Bitcoin, also: [SPARK] }
  - { id: EVM, label: Ethereum & EVM }
  - { id: SOL, label: Solana }
  - { id: TON, label: TON }
  - { id: TRON, label: TRON }
  - { id: APTOS, label: Aptos }
  - { id: COSMOS, label: Cosmos }

sections:
  - id: app
    label: Your app
    blurb: What people install. Start from a starter or from scratch
    path:
      label: You tap Send
      text: in a starter or your own screens
    lanes:
      - id: apps
        label: Starters
        blurb: One reference app per phone technology

  - id: platform
    label: Phone plumbing
    blurb: Carries the app's taps to the engine and the answers back
    path:
      label: The phone carries it
      text: the host binding hands the request across; services never see the keys
    lanes:
      - id: native
        label: Host binding
        blurb: The phone side. Each one talks to the engine through the sealed room below
      - id: services
        label: Services
        blurb: Run in the app beside the host binding. Look things up or keep things safe. Never touch the keys

  - id: core
    label: The engine
    blurb: Plain JavaScript. It runs in Node as-is, and that is the quickest way to try it. On a phone the kit runs it inside a Bare worklet instead, and everything in this box lives there
    module: pear-wrk-wdk
    seal: Keys never leave this box
    path:
      label: Inside the sealed room
      text: the assembler picks the wallet; a protocol may ask it to sign
    # Lanes listed here are drawn as one chain × capability grid instead of card rows.
    matrix: [wallets, protocols]
    why:
      label: Why a Bare worklet, not plain Node?
      points:
        - Plain Node works and developers know it. Nothing in this box needs the worklet to function.
        - One runtime, one SDK. The same bundle runs on iOS, Android and desktop, with no per-platform port.
        - Its own thread. Signing and network calls never block the app's screen.
        - A sealed room. Keys and seeds stay in the worklet; the app only ever sees the encrypted form.
    lanes:
      - id: kernel
        label: The assembler
        blurb: Creates each wallet and hands every protocol its account
      - id: protocols
        label: Protocols
        blurb: Things you do with money beyond sending. Each one holds a wallet and asks it to sign
        groups:
          - { id: swap, label: Swap, hint: same chain }
          - { id: swidge, label: Swap & bridge, hint: across chains }
          - { id: bridge, label: Bridge, hint: USD₮0 }
          - { id: lending, label: Earn & borrow }
          - { id: multisig, label: Shared approval, hint: multisig }
          - { id: fiat, label: Buy & sell for cash, hint: any chain }
          - { id: sda, label: Smart deposit address }
      - id: wallets
        label: Wallets
        blurb: One per chain. Hold the keys and sign. Variants hang under their base
        groups:
          - { id: base, label: Wallet, hint: holds the keys, signs }
          - { id: gasless, label: Fees paid in USD₮, hint: gasless variant }
          - { id: smart-account, label: Smart account, hint: account abstraction }
          - { id: layer, label: Layers & assets, hint: on top of the base wallet }
      - id: modules
        label: Other modules
        blurb: Loaded by the assembler like a protocol, but not about money
      - id: internals
        label: Under the hood
        blurb: Engine-side pieces the app never calls directly

  - id: foundation
    label: Foundation
    path:
      label: Everything stands on
      text: the shared rulebook
    blurb: What everything else imports. Runs wherever the modules run, in the worklet on a phone, in Node elsewhere. The blank forms every wallet and protocol fills in, and the reference data they all read

  - id: dev
    page: dev
    label: Developer resources
    blurb: For building with WDK. Not part of a shipped wallet
    lanes:
      - id: reference
        label: Learn
      - id: tools
        label: Build

