# Public metrics for the Dashboard page: npm downloads, GitHub stars, forks, contributors, pull requests, issues.
# Runs every day and on demand; merges per-repo daily series and a daily snapshot into data/metrics.json on main.
name: Metrics

on:
  schedule:
    - cron: "30 6 * * *" # daily 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write # to request the Pages build after the push; the legacy builder does not always notice one

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Collect today
        # Secrets are scoped to this one step so the pinned third-party actions never see them.
        # ATLAS_TOKEN: an org member's read-only token, used only to read the member list.
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node bin/collect-metrics.mjs
      - name: Commit the row
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metrics.json
          git commit -m "metrics: $(date -u +%F)"
          git pull --rebase origin main
          git push
      # GitHub Pages builds from main, but its legacy builder has skipped pushes before, leaving the site
      # stale while this job kept committing. Asking for the build is idempotent and takes twenty seconds.
      - name: Request the Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq .status
