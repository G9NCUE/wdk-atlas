# Public metrics for the Dashboard page: npm downloads, GitHub stars, forks, contributors, pull requests, issues.
# Runs every day and on demand; merges per-repo daily series and a daily snapshot into data/metrics.json on main.
name: Metrics

on:
  schedule:
    - cron: "30 6 * * *" # daily 06:30 UTC
  workflow_dispatch:

# Two runs pushing to main at once would race on the rebase, and the daily collection has no
# reason to overlap with itself. A run in flight finishes; it is not cancelled halfway through
# a push.
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the collector waits out GitHub's secondary rate limit, so it is not quick
    permissions:
      contents: write
      pages: write # to request the Pages build after the push; the legacy builder does not always notice one
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Collect today
        # The workflow token is the only credential: no stored secret. Teammates come from audit.team.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node bin/collect-metrics.mjs
      # Nothing checked this before committing, so a bad collection reached the site and the
      # Pages build was requested for it. These are the same commands the Checks workflow runs.
      - name: Check before committing
        run: |
          node bin/validate-atlas.mjs
          node --test test/*.test.mjs
          node bin/check-quality.mjs
          node bin/check-metrics.mjs
          node bin/check-public.mjs
      - name: Commit the row
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Every file the collector writes. data/summary.json had been left out since it was
          # introduced: thirty commits to metrics.json against two to the summary, which is what
          # the Map and the Developer Resources pages read their date from. data/third-party.json
          # holds the packages built by others, which the Dashboard reads on its own.
          git add data/metrics.json data/summary.json data/third-party.json
          # Nothing to commit is a quiet day, not a failure: npm can report the same numbers
          # twice, and a red cross on an unchanged day teaches everyone to ignore the crosses.
          if git diff --cached --quiet; then
            echo "no change in the collected data; nothing to commit"
            exit 0
          fi
          git commit -m "metrics: $(date -u +%F)"
          git pull --rebase origin main
          git push
      # GitHub Pages builds from main, but its legacy builder has skipped pushes before, leaving the site
      # stale while this job kept committing. Asking for the build is idempotent and takes twenty seconds.
      - name: Request the Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq .status
