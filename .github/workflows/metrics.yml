# Public metrics for the Dashboard page: npm downloads, GitHub stars, forks, contributors, pull requests, issues.
# Runs every day and on demand; merges per-repo daily series and a daily snapshot into data/metrics.json on main.
name: Metrics

on:
  schedule:
    - cron: "30 6 * * *" # daily 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect today
        run: node bin/collect-metrics.mjs
      - name: Commit the row
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metrics.json
          git commit -m "metrics: $(date -u +%F)"
          git pull --rebase origin main
          git push
