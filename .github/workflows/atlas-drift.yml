# Atlas drift: compares atlas.yaml with GitHub and npm, keeps one rolling issue up to date.
# Weekly, on demand, and on every push that touches atlas.yaml or the checker (report only on push).
name: Atlas drift

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
  push:
    paths: [atlas.yaml, bin/check-atlas.mjs, .github/workflows/atlas-drift.yml]

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # this job never pushes; keep the workflow token out of .git/config
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check the atlas
        # The workflow token is the only credential: no stored secret. Private repos look absent.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node bin/check-atlas.mjs --json > report.json
          node bin/check-atlas.mjs --render report.json > report.md
          echo "total=$(node -p 'require("./report.json").total')" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
        id: check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-drift-${{ github.run_number }}
          path: |
            report.md
            report.json
      - name: Update the rolling issue
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TOTAL: ${{ steps.check.outputs.total }}
        run: |
          set -euo pipefail
          gh label create atlas-drift --description "Kept up to date by the Atlas drift workflow" --color FF4E00 --force >/dev/null
          number=$(gh issue list --label atlas-drift --state open --json number --jq '.[0].number // empty')
          {
            echo "Findings from \`bin/check-atlas.mjs\`, rewritten on every run. Tick a box by fixing atlas.yaml or by adding the repo to \`audit.ignoreRepos\`; the next run drops it."
            echo
            cat report.md
            echo
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_"
          } > body.md
          if [ "$TOTAL" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "No findings on $(date -u +%F). Closing; the workflow reopens a new issue if drift comes back."
            fi
            exit 0
          fi
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "Atlas drift: $TOTAL findings" --body-file body.md
          else
            gh issue create --title "Atlas drift: $TOTAL findings" --label atlas-drift --body-file body.md
          fi
