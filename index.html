<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WDK Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="assets/wdk-logo.svg" />
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body>
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <a class="brand" href="./" aria-label="WDK Atlas home">
            <img class="brand-logo" src="assets/wdk-logo.svg" alt="WDK" width="170" height="61" />
          </a>
          <nav aria-label="Primary navigation">
            <ul class="nav">
              <li><a href="./" data-page="main">WDK Visual Map</a></li>
              <li><a href="./?page=dev" data-page="dev">Developer Resources</a></li>
              <li><a href="./?page=roadmap" data-page="roadmap">Roadmap</a></li>
              <li id="nav-questions" hidden><a href="./?page=questions" data-page="questions">Questions</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <header class="site-header">
      <div class="header-main">
        <h1 id="title">WDK Atlas</h1>
        <p id="subtitle" class="subtitle"></p>
        <label class="pending-toggle">
          <input type="checkbox" id="toggle-pending" checked />
          <span class="pending-toggle-switch" aria-hidden="true"></span>
          Include planned &amp; in progress features
        </label>
      </div>
      <div class="header-side">
        <ul class="legend" aria-label="Status legend">
          <li><span class="swatch shipped"></span> live</li>
          <li><span class="swatch wip"></span> wip</li>
          <li><span class="swatch planned"></span> planned</li>
          <li><span class="swatch ecosystem"></span> ecosystem</li>
        </ul>
      </div>
    </header>

    <p id="error" class="error" hidden></p>

    <div id="poster" class="poster" hidden></div>

    <aside id="drawer" class="drawer" role="dialog" aria-labelledby="drawer-title" hidden></aside>

    <script src="vendor/js-yaml.min.js"></script>
    <script src="vendor/marked.min.js"></script>
    <script src="app.js?v=3"></script>
  </body>
</html>
